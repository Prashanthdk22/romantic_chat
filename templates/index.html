<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Romantic Chat ❤️</title>

<style>

body{
    margin:0;
    padding:0;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;

    background: linear-gradient(135deg,#ff4d6d,#ff758f,#ff8fa3);

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:90%;
    max-width:500px;

    background:rgba(255,255,255,0.15);

    backdrop-filter:blur(10px);

    border-radius:20px;

    padding:30px;

    text-align:center;

    color:white;

    box-shadow:0 0 25px rgba(0,0,0,0.3);
}

h1{
    font-size:40px;
    margin-bottom:10px;
}

.message{
    font-size:22px;
    margin-top:20px;
    min-height:60px;
}
.first-chat{

    margin-top:30px;

    background:rgba(255,255,255,0.12);

    padding:20px;

    border-radius:15px;

    font-size:18px;

    line-height:1.6;
}
button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;

    background:white;
    color:#ff4d6d;

    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

/* HEARTS */

.heart{
    position:absolute;
    color:white;
    font-size:20px;
    animation:float 6s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(1);
        opacity:1;
    }

    100%{
        transform:translateY(-10vh) scale(2);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="message" id="message">
    Click below ❤️
</div>

<div class="first-chat">
    <h3>💌 Our First Chat</h3>

    <p>
        "Hi..." ❤️ <br><br>

        That one small message became
        my favorite beginning ever 💕
    </p>
</div>

    <button onclick="showMessage()">
        Romantic Message
    </button>

</div>

<script>

const messages = [

"Every moment with you feels magical ❤️",

"You are the reason behind my smile 😊",

"I fall for you more every day 💖",

"You make my world beautiful 🌍",

"My heart belongs to you forever ❤️",

"You are my happy place 💕",

"I love you endlessly 💘",

"You are the best thing that ever happened to me 💞",

"I still get butterflies when I see you 🦋",

"With you, every day feels special ✨",

"You complete my heart ❤️",

"I never want to lose you 💓",

"You are my dream come true 🌸",

"My favorite place is beside you 💑",

"Your smile is my weakness 😊",

"You make life so beautiful 🌹",

"I could talk to you forever 💬",

"You are my sunshine on dark days ☀️",

"I love the way you care for me 💗",

"You are my forever person 💍",

"No matter what happens, I’ll always choose you ❤️",

"You are my sweetest addiction 🍫",

"Life is perfect when you are with me 💕",

"I want to make memories with you forever 📸",

"You are my lucky charm 🍀",

"My heart skips a beat for you 💘"

];

function showMessage(){

    const random =
    messages[Math.floor(Math.random()*messages.length)];

    document.getElementById("message").innerHTML = random;
}

/* Animated Hearts */

function createHeart(){

    const heart = document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "❤️";

    heart.style.left = Math.random()*100 + "vw";

    heart.style.fontSize =
    Math.random()*20 + 20 + "px";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },6000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
